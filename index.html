<html>
<head>
    <meta charset="utf-8"/>
    <title>ChatAssistX</title>
    <script src="./js/dev-common.js?ver=20260321"></script>
    <script src="./js/config.js?ver=20260321"></script>
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/handlebars@4.7.8/dist/handlebars.min.js"></script>
    <script src="./js/chatassist.js?ver=20260411"></script>
    
    <link rel="stylesheet" href="https://assets.chatassistx.cc/css/jsassist.css?ver=20260315" type="text/css"/>
    <link rel="stylesheet" href="./css/font.css?ver=20260315" type="text/css"/>
    <link rel="stylesheet" href="https://assets.chatassistx.cc/css/chatassist.css?ver=20260315" type="text/css"/>
    <link rel="stylesheet" href="./css/local.css?ver=20260315" type="text/css"/>
</head>
<body>
<script id="chat-template" type="text/x-handlebars-template">
    <div class="chat_div" id="chat_{{num}}">
        <span class="chat_platform_{{platform}}"></span>
        <span class="chat_text_nickname">
            {{{nickname}}}
        </span>
        <div class="chat_text_message">
            {{{message}}}
        </div>
    </div>
</script>
<script id="chat-template-sticky" type="text/x-handlebars-template">
    <div class="fixed_chat">
    {{#ifCond nickname notitle}}
        <div class="chat_text_message_sticky_logo">
            {{{message}}}
        </div>
    {{else}}
        <span class="chat_platform_{{platform}}"></span>
        <span class="chat_text_nickname">
            {{{nickname}}}
        </span>
        <div class="chat_text_message_sticky">
            {{{message}}}
        </div>
    {{/ifCond}}
    </div>
</script>
<div class="chat_wrapper">
    <div class="chat_container">
    </div>
</div>
</body>
</html>
